<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Anytime Fitness | AFBGKY</title>
  <style>
    :root {
      --af-purple: #6E38D5;
      --af-purple-dark: #5A2DB0;
      --af-purple-darker: #221551;
      --af-purple-light: #D2A5FF;
      --af-bg: #FAF8FF;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--af-bg);
      color: var(--af-purple-darker);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      color: var(--af-purple);
      font-size: 2rem;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .subtitle {
      color: #666;
      margin-bottom: 32px;
      font-size: 0.95rem;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 16px 20px;
      margin-bottom: 12px;
      background: var(--af-purple);
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--af-purple-dark);
    }

    .btn-outline {
      background: transparent;
      color: var(--af-purple);
      border: 2px solid var(--af-purple);
    }

    .btn-outline:hover {
      background: rgba(110, 56, 213, 0.08);
    }

    .note {
      margin-top: 32px;
      font-size: 0.85rem;
      color: #777;
      line-height: 1.4;
    }
  </style>
</head>
