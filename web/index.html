<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Anytime Fitness</title>
  <style>
    :root {
      --af-purple: #6E38D5;
      --af-purple-dark: #5A2DB0;
      --af-purple-darker: #221551;
      --af-purple-light: #D2A5FF;
      --af-bg: #FAF8FF;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #e8e4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Phone frame on larger screens */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .phone {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background: var(--af-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(34, 21, 81, 0.25);
      border-radius: 0;
    }

    @media (min-width: 500px) {
      .phone {
        height: 844px;
        border-radius: 36px;
        border: 10px solid #1a1a1a;
      }
    }

    /* Status bar */
    .status-bar {
      height: calc(44px + var(--safe-top));
      background: var(--af-purple-dark);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      color: white;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* App bar */
    .app-bar {
      background: var(--af-purple);
      color: white;
      padding: 16px 20px 20px;
      text-align: center;
    }

    .app-bar h1 {
      margin: 0;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .app-bar .club {
      margin-top: 4px;
      font-size: 0.85rem;
      opacity: 0.9;
      font-weight: 500;
    }

    /* Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px calc(20px + var(--safe-bottom));
      -webkit-overflow-scrolling: touch;
    }

    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--af-purple);
      margin: 8px 4px 12px;
    }

    .tile {
      display: flex;
      align-items: center;
      background: white;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 12px;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 8px rgba(110, 56, 213, 0.08);
      border: 1px solid rgba(110, 56, 213, 0.06);
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .tile:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(110, 56, 213, 0.12);
    }

    .tile-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--af-purple), var(--af-purple-dark));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 14px;
      flex-shrink: 0;
      color: white;
      font-size: 22px;
    }

    .tile-text {
      flex: 1;
      text-align: left;
    }

    .tile-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--af-purple-darker);
    }

    .tile-sub {
      font-size: 0.8rem;
      color: #777;
      margin-top: 2px;
    }

    .tile-chevron {
      color: var(--af-purple);
      font-size: 1.4rem;
      font-weight: 300;
    }

    .footer-note {
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      margin-top: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
